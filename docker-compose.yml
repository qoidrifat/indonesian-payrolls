services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: indonesian-payroll/app
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-payroll}
      DB_USERNAME: ${DB_USERNAME:-payroll}
      DB_PASSWORD: ${DB_PASSWORD:-payroll}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: indonesian-payroll/app
    command: ["supervisord", "-c", "/var/www/html/docker/horizon/supervisord.conf"]
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-payroll}
      DB_USERNAME: ${DB_USERNAME:-payroll}
      DB_PASSWORD: ${DB_PASSWORD:-payroll}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-payroll}
      MYSQL_USER: ${DB_USERNAME:-payroll}
      MYSQL_PASSWORD: ${DB_PASSWORD:-payroll}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

volumes:
  mysql-data:
  redis-data:
